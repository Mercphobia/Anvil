name: Build VibeForge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          echo "starting gradle build..."
          sh gradlew :app:assembleDebug --console=plain --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | tee build.log | tail -80
          EXIT=${PIPESTATUS[0]}
          echo "gradle exit code: $EXIT"
          exit $EXIT

      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vibeforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
